[project]
name = "socialadz-workers"
version = "0.1.0"
description = "SOCIALADZGEN STUDIO v2 Python workers (Phase 0: engine config, ffmpeg check, local asset store, step cache)."
requires-python = ">=3.12,<3.13"
dependencies = ["python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
